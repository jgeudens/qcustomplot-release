name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Qt ${{ matrix.qt }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        qt: ['6.8.3', '6.10.3']

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: ${{ matrix.qt }}
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Smoke test
        working-directory: build/test-app
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./test_app --smoke

      - name: Upload smoke image
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: smoke-qt-${{ matrix.qt }}
          path: build/test-app/smoke.png
          if-no-files-found: ignore
